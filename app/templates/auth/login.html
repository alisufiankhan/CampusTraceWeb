{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-12 col-md-6 col-lg-4">
        <div class="card shadow">
            <div class="card-body p-4 text-center">
                <h2 class="text-teal fw-bold mb-2">CampusTrace</h2>
                <p class="text-muted mb-4">Lost & Found Management System</p>
                
                <form method="POST" action="{{ url_for('auth.login') }}">
                    <div class="mb-3 text-start">
                        <label for="user_id" class="form-label">User ID</label>
                        <input type="text" class="form-control" id="user_id" name="user_id" required>
                    </div>
                    <div class="mb-3 text-start">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="mb-4 text-start">
                        <label for="role" class="form-label">Role</label>
                        <select class="form-select" id="role" name="role">
                            <option value="student">Student</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-teal w-100">Login</button>
                </form>
                <div class="mt-4">
                    <small class="text-muted">Contact admin if you need access</small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
